# Find real download URLs on Dubai's reachable open-data sites.
#
# Plain crawling returned only navigation links, so the dataset lists are
# rendered client-side. This drives a real browser, reads the DOM after
# JavaScript runs, and records the network calls the pages make — those calls
# are the endpoints worth using, and they are not discoverable any other way.
name: Discover Dubai data downloads

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Kept out of package.json: this is a one-off investigation tool, not a
      # dependency of the library.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium

      - run: node scripts/discover-downloads.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery
          path: discovery
          if-no-files-found: ignore
