# Keep Dubai data fresh, automatically.
#
# The dld.areawise-* sources need no credentials and no UAE IP, so they run
# everywhere. The rest depend on Dubai Pulse, which is geo-fenced to the UAE
# and will fail from GitHub's runners — see docs/ACCESS-FINDINGS.md. Their
# failure is expected and does not stop the ones that work.
#
# Runs nightly, downloads each source from Dubai Pulse, normalises it, joins
# it to the canonical community registry, and publishes small per-community
# aggregates back into the repo. The raw ingest is kept as a build artifact
# rather than committed, because DLD's full history is far too large for git.
#
# Nothing here needs a human once the two repository secrets are set.
name: Ingest Dubai open data

on:
  schedule:
    # 03:00 Dubai time (UTC+4) — outside Pulse's busiest hours.
    - cron: '0 23 * * *'
  workflow_dispatch:

# Only one ingest at a time; a second would fight the first over the commit.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Ingest each source
        env:
          DUBAI_PULSE_CLIENT_ID: ${{ secrets.DUBAI_PULSE_CLIENT_ID }}
          DUBAI_PULSE_CLIENT_SECRET: ${{ secrets.DUBAI_PULSE_CLIENT_SECRET }}
          OPENDXB_DATA_DIR: ${{ github.workspace }}/ingest-data
        run: |
          # Sources that need nothing. These are the ones that actually run on
          # a GitHub runner, and a failure here is a genuine regression.
          CORE="dld.areawise-sales dld.areawise-mortgage"

          # Sources behind Dubai Pulse. The portal is geo-fenced to the UAE, so
          # these cannot succeed from GitHub regardless of credentials. They are
          # attempted only when credentials exist, and their failure is reported
          # but never fails the run — otherwise every nightly build goes red for
          # a reason nobody can fix from here.
          PULSE="khda.schools dha.facilities rta.stations dld.transactions dld.rents"

          core_failed=0
          for source in $CORE; do
            echo "::group::$source (core)"
            if node dist/cli/index.js ingest "$source"; then
              echo "$source: ok"
            else
              echo "$source: FAILED"
              core_failed=$((core_failed+1))
            fi
            echo "::endgroup::"
          done

          if [ -n "$DUBAI_PULSE_CLIENT_ID" ]; then
            for source in $PULSE; do
              echo "::group::$source (needs Dubai Pulse)"
              node dist/cli/index.js ingest "$source" || echo "$source: failed (expected outside the UAE)"
              echo "::endgroup::"
            done
          else
            echo "No Dubai Pulse credentials set; skipping: $PULSE"
          fi

          echo "core_failed=$core_failed" >> "$GITHUB_ENV"

      - name: Build per-community aggregates
        env:
          OPENDXB_DATA_DIR: ${{ github.workspace }}/ingest-data
        run: node scripts/build-profiles.mjs

      - name: Commit refreshed aggregates
        run: |
          git config user.name  "opendxb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/profiles
          if git diff --cached --quiet; then
            echo "No change in aggregates; nothing to commit."
          else
            git commit -m "data: refresh community aggregates ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Directory is `ingest-data`, not `.ingest`: upload-artifact treats
      # dot-prefixed paths as hidden and silently uploaded nothing.
      - name: Keep the raw ingest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-ingest
          path: ingest-data
          retention-days: 14
          if-no-files-found: warn

      # Only core sources gate the build. A Dubai Pulse source failing from a
      # US runner is the documented, unavoidable state — failing on it would
      # make every nightly run red and train everyone to ignore the signal.
      - name: Fail the run if a core source did not land
        if: env.core_failed != '0'
        run: |
          echo "::error::${{ env.core_failed }} core source(s) failed to ingest."
          exit 1
