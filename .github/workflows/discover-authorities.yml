# Hunt for open data endpoints at Dubai's other reachable authorities.
#
# The DLD gateway was found by watching what dubailand.gov.ae's own pages
# fetch. This repeats that against KHDA, Dubai Municipality and RTA — all
# confirmed reachable from outside the UAE, all still unexplored.
#
# The prize is a SECOND authority: a crosswalk between government datasets is
# worth nothing while only one dataset flows through it.
name: Discover other Dubai authorities

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An investigation tool, not a dependency of the library.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium

      - run: node scripts/discover-authorities.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorities
          path: authorities
          if-no-files-found: warn
