# Map the Dubai Pulse API host.
#
# The reachability diagnostic showed api.dubaipulse.gov.ae is reachable from a
# US runner while www.dubaipulse.gov.ae is firewalled. Automated ingest is
# therefore possible through the API — this works out its shape.
name: Explore Dubai Pulse API

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/explore-api.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: api-report.json
          if-no-files-found: ignore
