# Work out why a Dubai host is unreachable, and find one that is not.
#
# The first probe returned "fetch failed" for every dubaipulse.gov.ae URL
# while dubailand.gov.ae answered normally. That single message hides very
# different faults, so this walks DNS -> TCP -> TLS -> HTTP and reports the
# actual errno at each layer. A timeout at TCP with working DNS is what
# geo-blocking looks like from a US runner.
name: Diagnose Dubai host reachability

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-report
          path: diagnose-report.json
          if-no-files-found: ignore
